[package]
name = "zterminal-desktop"
version = "0.2.1"
description = "ZTerminal native desktop client"
authors = ["ZTerminal"]
edition = "2021"

[lib]
name = "zterminal_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"
