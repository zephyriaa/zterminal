name: Production Deployment Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test & Build Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Node dependencies
        run: npm ci

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run Node test suite
        run: npm test

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/quant-engine/requirements.txt || true

      - name: Run Python quant engine tests
        run: |
          python -m unittest services/quant-engine/tests/test_quant_worker.py || true

      - name: Build Next.js frontend
        run: npm run build
        env:
          DATABASE_URL: "file:./db/custom.db"
          NODE_ENV: production

  deploy-frontend:
    name: Deploy Frontend to Cloudflare
    needs: test-and-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build frontend for Cloudflare
        run: npm run cf:build
        env:
          DATABASE_URL: "file:./db/custom.db"
          NODE_ENV: production

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
        continue-on-error: true

  deploy-backend-vps:
    name: Update Backend Compute (OCI / VPS)
    needs: test-and-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to Remote Compute via SSH
        if: ${{ env.SSH_HOST != '' }}
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER || 'ubuntu' }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            cd ~/zterminal || git clone https://github.com/zephyriaa/zterminal.git ~/zterminal && cd ~/zterminal
            git pull origin main
            docker compose -f infrastructure/docker-compose.production.yml pull || true
            docker compose -f infrastructure/docker-compose.production.yml up -d --build
            curl -f http://localhost:8000/health || exit 1
