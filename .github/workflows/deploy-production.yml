name: Production Deployment Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test & Build Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Node dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Prepare isolated test database
        env:
          DATABASE_URL: file:/tmp/zterminal-release-ci.db
        run: npx prisma migrate deploy

      - name: Run Node test suite
        env:
          DATABASE_URL: file:/tmp/zterminal-release-ci.db
        run: npm test

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/quant-engine/requirements.txt || true

      - name: Run Python quant engine tests
        run: |
          python -m unittest services/quant-engine/tests/test_quant_worker.py || true

      - name: Build Next.js frontend
        run: npm run build
        env:
          DATABASE_URL: "file:./db/custom.db"
          NODE_ENV: production

  deploy-frontend:
    name: Deploy Frontend to Cloudflare
    needs: test-and-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build frontend for Cloudflare
        run: npm run cf:build
        env:
          # The build generates a PostgreSQL client; no live connection is made.
          DATABASE_URL: "postgresql://build:placeholder@127.0.0.1:5432/build"
          NODE_ENV: production

      - name: Smoke test built Cloudflare Worker
        run: npm run cf:smoke

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy --config wrangler.jsonc
