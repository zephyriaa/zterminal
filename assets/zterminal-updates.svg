<rect x="150" y="325" width="900" height="55" rx="18" fill="#0b1220" stroke="#30363d"/>
<text x="600" y="359" text-anchor="middle" fill="#8b949e" font-family="Inter,Segoe UI,sans-serif" font-size="15">Website download → canonical release metadata → Windows updater • User data stays separate from application versions</text>
