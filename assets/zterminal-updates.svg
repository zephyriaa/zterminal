<rect x="685" y="150" width="170" height="125" rx="20" fill="#111827" stroke="#f0883e"/>
<rect x="895" y="150" width="250" height="125" rx="20" fill="#111827" stroke="#d2a8ff"/>
</g>

<text x="82" y="190" fill="#58a6ff" font-family="Inter,Segoe UI,sans-serif" font-size="15" font-weight="700">01</text>
<text x="82" y="221" fill="#f0f6fc" font-family="Inter,Segoe UI,sans-serif" font-size="20" font-weight="700">BUILD</text>
<text x="82" y="250" fill="#8b949e" font-family="Inter,Segoe UI,sans-serif" font-size="14">CI + tests</text>

<text x="292" y="190" fill="#a371f7" font-family="Inter,Segoe UI,sans-serif" font-size="15" font-weight="700">02</text>
<text x="292" y="221" fill="#f0f6fc" font-family="Inter,Segoe UI,sans-serif" font-size="20" font-weight="700">SIGN</text>
<text x="292" y="250" fill="#8b949e" font-family="Inter,Segoe UI,sans-serif" font-size="14">Authenticode + manifest</text>

<text x="502" y="190" fill="#56d364" font-family="Inter,Segoe UI,sans-serif" font-size="15" font-weight="700">03</text>
<text x="502" y="221" fill="#f0f6fc" font-family="Inter,Segoe UI,sans-serif" font-size="20" font-weight="700">PUBLISH</text>
<text x="502" y="250" fill="#8b949e" font-family="Inter,Segoe UI,sans-serif" font-size="14">Immutable CDN artifact</text>

<text x="712" y="190" fill="#f0883e" font-family="Inter,Segoe UI,sans-serif" font-size="15" font-weight="700">04</text>
<text x="712" y="221" fill="#f0f6fc" font-family="Inter,Segoe UI,sans-serif" font-size="20" font-weight="700">ROLLOUT</text>
<text x="712" y="250" fill="#8b949e" font-family="Inter,Segoe UI,sans-serif" font-size="14">Internal → beta → stable</text>

<text x="922" y="190" fill="#d2a8ff" font-family="Inter,Segoe UI,sans-serif" font-size="15" font-weight="700">05</text>
<text x="922" y="221" fill="#f0f6fc" font-family="Inter,Segoe UI,sans-serif" font-size="20" font-weight="700">UPDATE + ROLLBACK</text>
<text x="922" y="250" fill="#8b949e" font-family="Inter,Segoe UI,sans-serif" font-size="14">Background download · safe restart · known-good fallback</text>

