<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0d1117"/><stop offset="1" stop-color="#161b22"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".35"/></filter></defs>
<rect width="1200" height="430" rx="26" fill="url(#bg)"/>
<text x="65" y="68" fill="#f0f6fc" font-family="Inter,Segoe UI,sans-serif" font-size="30" font-weight="700">Build once. Distribute safely. Update quietly.</text>
<text x="65" y="100" fill="#8b949e" font-family="Inter,Segoe UI,sans-serif" font-size="17">The website and Windows client consume the same signed release source of truth.</text>

