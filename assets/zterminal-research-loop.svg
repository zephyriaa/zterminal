<text x="65" y="68" fill="#f0f6fc" font-family="Inter,Segoe UI,sans-serif" font-size="30" font-weight="700">Research → Validate → Improve</text>
<text x="65" y="100" fill="#8b949e" font-family="Inter,Segoe UI,sans-serif" font-size="17">A repeatable workflow for turning an idea into measured evidence.</text>

<g filter="url(#s)">
