<rect x="895" y="155" width="235" height="120" rx="20" fill="#111827" stroke="#3fb950"/>
</g>

<text x="98" y="195" fill="#58a6ff" font-family="Inter,Segoe UI,sans-serif" font-size="16" font-weight="700">01</text>
<text x="98" y="225" fill="#f0f6fc" font-family="Inter,Segoe UI,sans-serif" font-size="22" font-weight="700">HYPOTHESIS</text>
<text x="98" y="253" fill="#8b949e" font-family="Inter,Segoe UI,sans-serif" font-size="15">Define objective rules.</text>

<text x="373" y="195" fill="#a371f7" font-family="Inter,Segoe UI,sans-serif" font-size="16" font-weight="700">02</text>
<text x="373" y="225" fill="#f0f6fc" font-family="Inter,Segoe UI,sans-serif" font-size="22" font-weight="700">BACKTEST</text>
<text x="373" y="253" fill="#8b949e" font-family="Inter,Segoe UI,sans-serif" font-size="15">Test historical behavior.</text>

<text x="648" y="195" fill="#f0883e" font-family="Inter,Segoe UI,sans-serif" font-size="16" font-weight="700">03</text>
<text x="648" y="225" fill="#f0f6fc" font-family="Inter,Segoe UI,sans-serif" font-size="22" font-weight="700">ROBUSTNESS</text>
<text x="648" y="253" fill="#8b949e" font-family="Inter,Segoe UI,sans-serif" font-size="15">Try to break the edge.</text>

<text x="923" y="195" fill="#56d364" font-family="Inter,Segoe UI,sans-serif" font-size="16" font-weight="700">04</text>
<text x="923" y="225" fill="#f0f6fc" font-family="Inter,Segoe UI,sans-serif" font-size="22" font-weight="700">VALIDATION</text>
<text x="923" y="253" fill="#8b949e" font-family="Inter,Segoe UI,sans-serif" font-size="15">Out-of-sample evidence.</text>

