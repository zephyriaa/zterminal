services:
  - type: web
    name: zterminal
    runtime: docker
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: commit
    healthCheckPath: /healthz
    envVars:
      - key: MARKET_PROVIDER
        value: gateio
      - key: ALLOWED_ORIGIN
        value: https://zterminal.onrender.com
      - key: MARKET_DATA_PORT
        value: "3003"
      - key: APP_PORT
        value: "3000"
