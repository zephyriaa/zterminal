[workspace]
resolver = "2"
members = [
  "crates/zt-protocol",
  "crates/zt-core",
  "crates/zt-storage",
  "crates/zt-adapters",
  "apps/desktop-phase0-cli",
  "apps/zt-local-scene-bridge",
  "apps/zt-local-monte-carlo",
  "apps/zt-offline-provider-import",
  "apps/zt-direct-public-ingest",
]
# The legacy Tauri/NSIS preview is deliberately separate from the future native
# client workspace. It remains a standalone Cargo package for Track A.
exclude = ["src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
authors = ["ZTerminal"]
repository = "https://github.com/zephyriaa/zterminal"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
